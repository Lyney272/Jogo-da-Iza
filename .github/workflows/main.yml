name: Gerar Minha Capivara

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Criar EXE
        run: pyinstaller --onefile --windowed --name MinhaCapivara main.py

      - name: Salvar EXE
        uses: actions/upload-artifact@v4
        with:
          name: MinhaCapivara
          path: dist/MinhaCapivara.exe
