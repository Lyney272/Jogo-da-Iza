name: Criar EXE da Capivara

on:
  workflow_dispatch:

jobs:
  criar-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install pyinstaller

      - run: python -m PyInstaller --onefile --windowed --name MinhaCapivara jogo.py

      - uses: actions/upload-artifact@v4
        with:
          name: MinhaCapivara
          path: dist/MinhaCapivara.exe
