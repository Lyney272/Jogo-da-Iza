name: Criar CapiCare EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Criar executavel
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm --name CapiCare main.py

      - name: Enviar EXE
        uses: actions/upload-artifact@v4
        with:
          name: CapiCare-Windows
          path: dist/CapiCare.exe

